name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The three things the README promises work on a bare interpreter, checked bare.
      - name: Conformance vectors (no install)
        run: PYTHONPATH=src python -m fmtcontrol_xy.conformance
      - name: Example (no install)
        run: python examples/ops_table_control.py

      - name: Install with test extras
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
